<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image Transform Studio Runner</title>
</head>
<body>
  <script>
    const DEFAULT_CONFIG = {
      originalRequest: 'Transform an image',
      outputFormat: 'original',
      targetSizeKB: null,
      quality: null,
      resize: {
        mode: 'none',
        maxWidth: null,
        maxHeight: null,
        width: null,
        height: null,
        percentage: null,
        onlyShrink: true
      },
      stripMetadata: true,
      autoOrient: true,
      backgroundColor: '#ffffff',
      filenameHint: 'transformed-image'
    };

    window['ai_edge_gallery_get_result'] = async (data) => {
      try {
        const raw = data ? JSON.parse(data) : {};
        const config = normalizeConfig(raw);
        const payload = encodePayload(config);

        return JSON.stringify({
          result: summaryFor(config),
          webview: {
            url: `webview.html?payload=${payload}`,
            aspectRatio: 0.86
          }
        });
      } catch (error) {
        console.error(error);
        return JSON.stringify({
          error: `Failed to open image transform panel: ${error.message}`
        });
      }
    };

    function normalizeConfig(raw) {
      const request = cleanText(raw.originalRequest || raw.request || raw.prompt) || DEFAULT_CONFIG.originalRequest;
      const inferred = inferFromRequest(request);
      const requestedFormat = raw.outputFormat || raw.format || inferred.outputFormat;
      const targetSizeKB = clampNullableNumber(
        firstDefined(raw.targetSizeKB, raw.targetKB, raw.maxKB, inferred.targetSizeKB),
        1,
        51200
      );
      const outputFormat = normalizeFormat(requestedFormat, targetSizeKB);
      const qualityFallback = outputFormat === 'png' ? null : (targetSizeKB ? 85 : 92);
      const quality = clampNullableNumber(firstDefined(raw.quality, inferred.quality, qualityFallback), 1, 100);
      const resize = normalizeResize(raw.resize || {}, inferred.resize);

      return {
        originalRequest: request.slice(0, 240),
        outputFormat,
        targetSizeKB,
        quality,
        resize,
        stripMetadata: normalizeBoolean(raw.stripMetadata, true),
        autoOrient: normalizeBoolean(raw.autoOrient, true),
        backgroundColor: normalizeColor(raw.backgroundColor) || DEFAULT_CONFIG.backgroundColor,
        filenameHint: slugify(raw.filenameHint || inferred.filenameHint || filenameHintFor(outputFormat, targetSizeKB, resize))
      };
    }

    function inferFromRequest(request) {
      const text = String(request || '').toLowerCase();
      const inferred = {
        outputFormat: null,
        targetSizeKB: null,
        quality: null,
        resize: null,
        filenameHint: null
      };

      if (/\b(jpe?g|jpg)\b/.test(text)) {
        inferred.outputFormat = 'jpeg';
      } else if (/\bpng\b|transparent|transparency|lossless/.test(text)) {
        inferred.outputFormat = 'png';
      } else if (/\bwebp\b/.test(text)) {
        inferred.outputFormat = 'webp';
      }

      const sizeMatch = text.match(/(?:under|below|less than|max(?:imum)?|limit|to|<=?)\s*([0-9]+(?:\.[0-9]+)?)\s*(kb|kib|kilobytes?|mb|mib|megabytes?)/i);
      if (sizeMatch) {
        const value = Number(sizeMatch[1]);
        const unit = sizeMatch[2].toLowerCase();
        inferred.targetSizeKB = /mb|mib|mega/.test(unit) ? Math.round(value * 1024) : Math.round(value);
        if (!inferred.outputFormat) {
          inferred.outputFormat = 'jpeg';
        }
        inferred.filenameHint = 'compressed-image';
      }

      const qualityMatch = text.match(/\bquality\s*(?:of|at|to|=|:)?\s*([0-9]{1,3})\b/i);
      if (qualityMatch) {
        inferred.quality = Number(qualityMatch[1]);
      }

      const exactMatch = text.match(/\b(?:exactly|exact|force)?\s*([0-9]{2,5})\s*(?:x|by)\s*([0-9]{2,5})\b/i);
      if (exactMatch && /\b(exact|exactly|force|size|resize|dimensions?)\b/.test(text)) {
        inferred.resize = {
          mode: 'exact',
          width: Number(exactMatch[1]),
          height: Number(exactMatch[2]),
          maxWidth: null,
          maxHeight: null,
          percentage: null,
          onlyShrink: false
        };
        inferred.filenameHint = inferred.filenameHint || 'resized-image';
      }

      if (!inferred.resize) {
        const withinMatch = text.match(/\b(?:within|inside|fit(?:\s+within)?|max(?:imum)?)\s*([0-9]{2,5})\s*(?:x|by)\s*([0-9]{2,5})\b/i);
        if (withinMatch) {
          inferred.resize = {
            mode: 'fit-within',
            maxWidth: Number(withinMatch[1]),
            maxHeight: Number(withinMatch[2]),
            width: null,
            height: null,
            percentage: null,
            onlyShrink: true
          };
          inferred.filenameHint = inferred.filenameHint || 'resized-image';
        }
      }

      if (!inferred.resize) {
        const widthMatch = text.match(/\b(?:width|wide)\s*(?:to|=|:)?\s*([0-9]{2,5})\b/i);
        if (widthMatch) {
          inferred.resize = resizeWith('width', Number(widthMatch[1]));
          inferred.filenameHint = inferred.filenameHint || 'resized-image';
        }
      }

      if (!inferred.resize) {
        const heightMatch = text.match(/\b(?:height|tall)\s*(?:to|=|:)?\s*([0-9]{2,5})\b/i);
        if (heightMatch) {
          inferred.resize = resizeWith('height', Number(heightMatch[1]));
          inferred.filenameHint = inferred.filenameHint || 'resized-image';
        }
      }

      if (!inferred.resize) {
        const percentMatch = text.match(/\b([0-9]{1,3})\s*%\b/i);
        if (percentMatch || /\bhalf\s+size\b/.test(text) || /\bdouble\s+size\b/.test(text)) {
          const percentage = percentMatch ? Number(percentMatch[1]) : (/\bdouble\s+size\b/.test(text) ? 200 : 50);
          inferred.resize = {
            mode: 'percentage',
            maxWidth: null,
            maxHeight: null,
            width: null,
            height: null,
            percentage,
            onlyShrink: percentage <= 100
          };
          inferred.filenameHint = inferred.filenameHint || 'resized-image';
        }
      }

      if (!inferred.resize) {
        const maxEdgeMatch = text.match(/\b(?:max(?:imum)?|longest|larger|largest|resize(?:\s+to)?|side|edge)\D{0,24}([0-9]{3,5})\s*(?:px|pixels?)?\b/i);
        if (maxEdgeMatch && /\b(max|maximum|longest|larger|largest|resize|side|edge|pixel|px)\b/.test(text)) {
          const size = Number(maxEdgeMatch[1]);
          inferred.resize = {
            mode: 'fit-within',
            maxWidth: size,
            maxHeight: size,
            width: null,
            height: null,
            percentage: null,
            onlyShrink: true
          };
          inferred.filenameHint = inferred.filenameHint || 'resized-image';
        }
      }

      return inferred;
    }

    function normalizeResize(rawResize, inferredResize) {
      const source = inferredResize || rawResize || {};
      const mode = normalizeResizeMode(source.mode || rawResize.mode);
      const onlyShrink = normalizeBoolean(firstDefined(rawResize.onlyShrink, source.onlyShrink), mode !== 'exact' && mode !== 'percentage');

      return {
        mode,
        maxWidth: clampNullableNumber(firstDefined(rawResize.maxWidth, source.maxWidth), 1, 50000),
        maxHeight: clampNullableNumber(firstDefined(rawResize.maxHeight, source.maxHeight), 1, 50000),
        width: clampNullableNumber(firstDefined(rawResize.width, source.width), 1, 50000),
        height: clampNullableNumber(firstDefined(rawResize.height, source.height), 1, 50000),
        percentage: clampNullableNumber(firstDefined(rawResize.percentage, source.percentage), 1, 1000),
        onlyShrink
      };
    }

    function normalizeFormat(format, targetSizeKB) {
      const value = cleanText(format).toLowerCase();

      if (value === 'jpg' || value === 'jpeg') {
        return 'jpeg';
      }

      if (value === 'png') {
        return 'png';
      }

      if (value === 'webp' || value === 'web-p') {
        return 'webp';
      }

      if (value === 'original' || value === 'same' || value === 'keep') {
        return 'original';
      }

      return targetSizeKB ? 'jpeg' : DEFAULT_CONFIG.outputFormat;
    }

    function normalizeResizeMode(mode) {
      const value = cleanText(mode).toLowerCase();
      const allowed = ['none', 'fit-within', 'width', 'height', 'exact', 'percentage'];

      return allowed.includes(value) ? value : 'none';
    }

    function normalizeBoolean(value, fallback) {
      if (typeof value === 'boolean') {
        return value;
      }

      if (typeof value === 'string') {
        const lowered = value.toLowerCase();
        if (['true', 'yes', '1', 'on'].includes(lowered)) {
          return true;
        }
        if (['false', 'no', '0', 'off'].includes(lowered)) {
          return false;
        }
      }

      return fallback;
    }

    function clampNullableNumber(value, min, max) {
      if (value === null || value === undefined || value === '') {
        return null;
      }

      const number = Number(value);

      if (!Number.isFinite(number)) {
        return null;
      }

      return Math.min(max, Math.max(min, Math.round(number)));
    }

    function cleanText(value) {
      if (typeof value !== 'string') {
        return '';
      }

      return value.replace(/\s+/g, ' ').trim();
    }

    function normalizeColor(value) {
      const color = cleanText(value);

      if (/^#[0-9a-f]{6}$/i.test(color)) {
        return color.toLowerCase();
      }

      if (/^#[0-9a-f]{3}$/i.test(color)) {
        return `#${color[1]}${color[1]}${color[2]}${color[2]}${color[3]}${color[3]}`.toLowerCase();
      }

      return null;
    }

    function resizeWith(mode, value) {
      return {
        mode,
        maxWidth: null,
        maxHeight: null,
        width: mode === 'width' ? value : null,
        height: mode === 'height' ? value : null,
        percentage: null,
        onlyShrink: true
      };
    }

    function firstDefined() {
      for (const value of arguments) {
        if (value !== undefined) {
          return value;
        }
      }

      return undefined;
    }

    function filenameHintFor(format, targetSizeKB, resize) {
      if (targetSizeKB) {
        return format === 'webp' ? 'compressed-webp' : 'compressed-image';
      }

      if (resize && resize.mode && resize.mode !== 'none') {
        return 'resized-image';
      }

      if (format !== 'original') {
        return 'converted-image';
      }

      return DEFAULT_CONFIG.filenameHint;
    }

    function slugify(value) {
      const slug = cleanText(String(value || ''))
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '')
        .slice(0, 64);

      return slug || DEFAULT_CONFIG.filenameHint;
    }

    function encodePayload(config) {
      const json = JSON.stringify(config);
      const base64 = btoa(unescape(encodeURIComponent(json)));

      return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');
    }

    function summaryFor(config) {
      const parts = [];
      parts.push(config.outputFormat === 'original' ? 'original format' : config.outputFormat.toUpperCase());

      if (config.targetSizeKB) {
        parts.push(`under ${config.targetSizeKB} KB`);
      }

      if (config.resize.mode !== 'none') {
        parts.push(resizeSummary(config.resize));
      }

      return `Opened Image Transform Studio with ${parts.join(', ')} prefilled.`;
    }

    function resizeSummary(resize) {
      if (resize.mode === 'fit-within') {
        return `fit within ${resize.maxWidth || 'any'}x${resize.maxHeight || 'any'}`;
      }

      if (resize.mode === 'width') {
        return `${resize.width}px wide`;
      }

      if (resize.mode === 'height') {
        return `${resize.height}px tall`;
      }

      if (resize.mode === 'exact') {
        return `${resize.width}x${resize.height}`;
      }

      if (resize.mode === 'percentage') {
        return `${resize.percentage}% scale`;
      }

      return 'no resize';
    }
  </script>
</body>
</html>
